<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CRUD Minimalista — Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

  <div class="container" style="max-width: 800px;">
    <h2 class="mb-4 fw-bold">Gestión de Clientes (CRUD)</h2>

    <!-- Formulario -->
    <div class="card border-0 shadow-sm p-4 mb-4 bg-white rounded-4">
      <form id="form-crud">
        <input type="hidden" id="clienteId">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nombre</label>
            <input type="text" id="nombre" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Correo electrónico</label>
            <input type="email" id="email" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Fecha Nacimiento</label>
            <input type="date" id="fechaNacimiento" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Estado</label>
            <select id="estado" class="form-select">
              <option value="activo">Activo</option>
              <option value="inactivo">Inactivo</option>
            </select>
          </div>
          <div class="col-md-4 d-flex align-items-center pt-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="consentimientoEmail">
              <label class="form-check-label" for="consentimientoEmail">Acepta Marketing</label>
            </div>
          </div>
          <div class="col-12 text-end">
            <button type="submit" class="btn btn-dark px-4">Guardar Cliente</button>
          </div>
        </div>
      </form>
    </div>

    <!-- Tabla -->
    <div class="card border-0 shadow-sm p-4 bg-white rounded-4">
      <h3 class="h5 fw-bold mb-3">Lista de Clientes</h3>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead class="table-light">
            <tr>
              <th>Nombre</th>
              <th>Email</th>
              <th>Nacimiento</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-clientes">
            <tr><td colspan="5" class="text-center">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="assets/js/crud.js"></script>
</body>
</html>
