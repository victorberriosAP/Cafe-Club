<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Admin — Café Club</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8f9fa;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-login {
      max-width: 420px;
      width: 100%;
      border: none;
      box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.08) !important;
    }
  </style>
</head>
<body>

  <div class="container px-3">
    <div class="card card-login bg-white rounded-4 p-4 p-md-5 mx-auto">
      
      <div class="text-center mb-4">
        <h1 class="h4 fw-bold mb-1">☕ Café Club</h1>
        <p class="text-muted small">Panel de Administración</p>
      </div>

      <form id="form-login">
        <div class="mb-3">
          <label for="email" class="form-label small fw-semibold text-secondary">Correo electrónico</label>
          <input type="email" class="form-control rounded-3 py-2" id="email" placeholder="admin@cafeclub.com" required>
        </div>
        
        <div class="mb-4">
          <label for="password" class="form-label small fw-semibold text-secondary">Contraseña</label>
          <input type="password" class="form-control rounded-3 py-2" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btn-ingresar" class="btn btn-dark w-100 py-2 rounded-3 fw-semibold shadow-sm">
          Ingresar al Sistema
        </button>
      </form>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('form-login').addEventListener('submit', (e) => {
      e.preventDefault();
      localStorage.setItem('cafe_admin_auth', 'true');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
