<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Locales — Café Club</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark sticky-top bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">☕ Café Club <span class="badge bg-danger text-white ms-2">Admin</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="clientes.html">Clientes</a></li>
          <li class="nav-item"><a class="nav-link active" href="locales.html">Locales</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5" style="max-width: 950px;">
    <h2 class="mb-4 fw-bold">Gestión de Sucursales / Locales</h2>

    <!-- Formulario -->
    <div class="card border-0 shadow-sm p-4 mb-4 bg-white rounded-4">
      <form id="form-crud-locales">
        <input type="hidden" id="cafeteriaId">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nombre de la Sucursal</label>
            <input type="text" id="nombre" class="form-control" placeholder="ej. Café Club — Providencia" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Slug (Identificador URL)</label>
            <input type="text" id="slug" class="form-control" placeholder="ej. providencia" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Dirección</label>
            <input type="text" id="direccion" class="form-control" placeholder="ej. Av. Providencia 1234" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Estado</label>
            <select id="estado" class="form-select">
              <option value="activo">Activo</option>
              <option value="inactivo">Inactivo</option>
            </select>
          </div>
          <div class="col-12 text-end pt-2">
            <button type="submit" class="btn btn-dark px-4">Guardar Local</button>
          </div>
        </div>
      </form>
    </div>

    <!-- Tabla -->
    <div class="card border-0 shadow-sm p-4 bg-white rounded-4">
      <h3 class="h5 fw-bold mb-3">Lista de Sucursales</h3>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Sucursal</th>
              <th>Slug</th>
              <th>Dirección</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-locales">
            <tr><td colspan="6" class="text-center py-3 text-muted">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/crud-locales.js"></script>
</body>
</html>
