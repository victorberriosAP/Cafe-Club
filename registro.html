<!-- registro.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro — Café Club</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <!-- Google Identity Services (GIS) para el botón de Google -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">☕ Café Club</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="cafeterias.html">Cafeterías</a>
      </div>
    </div>
  </nav>

  <main class="container my-5" style="max-width: 600px;">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
      <h1 class="h3 fw-bold text-center mb-2">Crea tu Tarjeta Digital</h1>
      <p class="text-center text-muted mb-4" id="subtitulo-cafe">Regístrate para comenzar a acumular estrellas.</p>

      <!-- Mensajes de alerta -->
      <div id="alerta-registro" class="alert d-none" role="alert"></div>

      <!-- Botón de Google Auth -->
      <div class="text-center mb-4">
        <div id="g_id_onload"
             data-client_id="31756994840-b1a3hbpdal3bu5tb2jfq3vb0atvthn24.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="sign_in_with"
             data-shape="rectangular"
             data-logo_alignment="left">
        </div>
        <div class="d-flex align-items-center my-3">
          <hr class="flex-grow-1">
          <span class="px-3 text-muted small">o completa tus datos</span>
          <hr class="flex-grow-1">
        </div>
      </div>

      <form id="form-registro" novalidate>
        <input type="hidden" id="cafeId" name="cafe" value="">

        <div class="mb-3">
          <label for="nombre" class="form-label fw-semibold">Nombre completo</label>
          <input type="text" class="form-control" id="nombre" required placeholder="Ej. Ana Pérez">
          <div class="invalid-feedback">Por favor ingresa tu nombre.</div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Correo electrónico</label>
          <input type="email" class="form-control" id="email" required placeholder="tu@correo.com">
          <div class="invalid-feedback">Ingresa un correo electrónico válido.</div>
        </div>

        <div class="mb-3">
          <label for="fechaNacimiento" class="form-label fw-semibold">Fecha de nacimiento <span class="text-muted fw-normal">(opcional para regalo)</span></label>
          <input type="date" class="form-control" id="fechaNacimiento">
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="terminos" required>
          <label class="form-check-label text-muted small" for="terminos">
            Acepto el aviso de privacidad y las condiciones de la tarjeta de fidelización. *
          </label>
          <div class="invalid-feedback">Debes aceptar los términos para continuar.</div>
        </div>

        <div class="mb-4 form-check">
          <input type="checkbox" class="form-check-input" id="promos">
          <label class="form-check-label text-muted small" for="promos">
            Acepto recibir promociones, beneficios especiales y novedades por correo.
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Crear mi Tarjeta</button>
      </form>
    </div>
  </main>

  <footer class="site-footer mt-auto py-4 bg-white border-top">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
      <span class="text-muted">© 2026 Café Club</span>
      <span class="text-muted">
        Creado por
        <a href="https://itera-ecru.vercel.app/" target="_blank" rel="noopener noreferrer">ITERA</a>
        — IMAGINA | DESARROLLA | IMPLEMENTA
      </span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
